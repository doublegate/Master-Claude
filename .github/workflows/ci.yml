name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read   # least-privilege; CI only needs to read the repo (CodeQL: actions/missing-workflow-permissions)

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Shell lint (shellcheck)
        # Fail on warning+ (errors/warnings); info/style notes are advisory and must not
        # break the build across shellcheck version drift between dev machines and CI.
        run: shellcheck --severity=warning bin/*.sh guards/*.sh test/*.sh

      - name: Workflow lint (actionlint)
        # Lints .github/workflows for correctness and common security smells (e.g. injection).
        # Pinned to a version + immutable digest for reproducibility (Dependabot keeps it fresh).
        run: docker run --rm -v "$PWD":/repo --workdir /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

      - name: Markdown lint (markdownlint-cli2)
        # Version-pinned deliberately: module 40 notes that a newer linter reports rules the
        # gate never agreed to, so an unpinned runner turns an unrelated release into a red
        # build. Rule selection (what is enforced vs disabled by design) lives in
        # .markdownlint.json with the rationale for each exemption.
        run: npx --yes markdownlint-cli2@0.24.0 "**/*.md"

      - name: Self-tests
        run: sh test/run.sh

      - name: SkillSpector gate tests
        # test/run.sh covers the shell guards only; without this step the Python gate's
        # suite would never run in CI. Stdlib only: SkillSpector itself is mocked.
        # Discovery, not `-m unittest test/...`: on Pythons that ship the stdlib `test`
        # package (e.g. Homebrew), the dotted name resolves to it and the import fails.
        run: python3 -m unittest discover -s test -p 'test_skillspector_gate.py'

      - name: Self-check (repo invariants)
        # Self-host gate: symlinks resolve, AGENTS.md + every module/doc <=200 lines,
        # VERSION present + semver, memory-core frontmatter complete, docs/modules aligned.
        run: sh bin/mc-selfcheck.sh
